name: tests
# The suite against real git on both operating systems Rick uses: Linux in the cloud sessions, Windows on his PC.
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git config --global user.name tests && git config --global user.email tests@simlocker.local
      - run: npm ci
      - run: npm test
      - run: npm run lines
